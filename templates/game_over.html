{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thanks for Playing</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>


<body class="finish-page">

    <div class="finish-glow finish-glow-one"></div>
    <div class="finish-glow finish-glow-two"></div>


    <main class="finish-container">

        <div class="finish-card">

            <div class="finish-icon">
                ✓
            </div>


            <span class="finish-eyebrow">
                SESSION COMPLETE
            </span>


            <h1>
                Thanks for playing.
            </h1>


            <p>
                Your game has ended.
                Ready for another round?
            </p>


            <div class="finish-divider"></div>


            <div class="finish-actions">

                <a
                    href="{% url 'game' %}"
                    class="finish-primary"
                >
                    Back to Game
                    <span>→</span>
                </a>


                <a
                    href="{% url 'logout' %}"
                    class="finish-secondary"
                >
                    Logout
                </a>

            </div>

        </div>


        <p class="finish-footer">
            Guess smart. Play again.
        </p>

    </main>

</body>

</html>
